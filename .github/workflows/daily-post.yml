name: Daily after-the-bell draft

on:
  schedule:
    # Weekdays at 22:12 UTC = 2:12 PM PST (3:12 PM PDT), after the 4 PM ET close.
    - cron: "12 22 * * 1-5"
  workflow_dispatch: {}

concurrency: daily-post

permissions:
  contents: read
  actions: read   # lets the veto check see your Telegram taps instantly

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      AUTOPUBLISH: ${{ vars.AUTOPUBLISH }}
      MORNING_AUTOPUBLISH: ${{ vars.MORNING_AUTOPUBLISH }}
      VETO_MINUTES: ${{ vars.VETO_MINUTES }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter && break; echo "apt failed, retrying"; sleep 20; done
          pip install -r requirements.txt || { sleep 20; pip install -r requirements.txt; }
          python -m playwright install --with-deps chromium || { sleep 20; python -m playwright install --with-deps chromium; }
      - name: Tests
        run: python -m pytest -q
      - name: Build today's draft
        id: draft
        run: python -m tickerdaily draft
      - name: Veto window, then publish
        if: steps.draft.outputs.auto == 'true'
        run: python -m tickerdaily autopublish --post-id "${{ steps.draft.outputs.post_id }}"
      - name: Keep the slides as a downloadable artifact
        if: always() && steps.draft.outputs.post_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ github.run_id }}
          path: out/
          retention-days: 30
      - name: Tell me if it broke
        if: failure()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Daily draft failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
